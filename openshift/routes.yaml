apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend-route
  namespace: eventplanner
spec:
  to:
    kind: Service
    name: backend-service
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend-route
  namespace: eventplanner
spec:
  to:
    kind: Service
    name: frontend-service
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect